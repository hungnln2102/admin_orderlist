user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=edge_general:10m rate=25r/s;
    limit_req_zone $binary_remote_addr zone=edge_api:10m rate=15r/s;
    limit_conn_zone $binary_remote_addr zone=edge_per_ip:10m;
    limit_req_status 429;

    map $http_user_agent $bad_scanner_ua {
        default 0;
        ~*(nikto|sqlmap|masscan|zgrab|acunetix|nessus|openvas|wpscan|dirbuster|gobuster|havij) 1;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Include server configs
    include /etc/nginx/conf.d/*.conf;
}
