name: Admin CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: admin_ci_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d admin_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          # Required by backend config; unit tests must not connect.
          DATABASE_URL: postgresql://unit:unit@127.0.0.1:1/unit
      - name: Verify bank reconciliation against PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/admin_ci_test
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" npm run migrate
          npm run test:integration -- tests/integration/vpbankEmailIngestion.test.js tests/integration/webhook_financial_account_balance.test.js
      - run: npm run build
        working-directory: frontend
      - run: |
          bash -n deploy.sh
          find backend/src -type f -name '*.js' -print0 | xargs -0 -n 1 node --check

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: admin-production
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - name: Deploy validated commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?}" "${DEPLOY_USER:?}" "${DEPLOY_SSH_KEY:?}" "${DEPLOY_KNOWN_HOSTS:?}"
          umask 077
          credentials=$(mktemp -d)
          trap 'rm -rf "$credentials"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$credentials/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$credentials/known_hosts"
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$credentials/known_hosts" -i "$credentials/key" \
            -- "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /var/www/admin_orderlist && git diff --quiet && git diff --cached --quiet && git fetch origin main && git merge-base --is-ancestor $REVISION FETCH_HEAD && git merge --ff-only $REVISION && bash deploy.sh --commit $REVISION"
