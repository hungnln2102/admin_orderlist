services:
  # ==========================================
  # 1. DATABASE SERVICE (PostgreSQL 16)
  # ==========================================
  postgres:
    container_name: admin_orderlist-postgres
    build:
      context: ./database
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASS:-change_me}
      POSTGRES_DB: ${DB_NAME:-mydtbmav}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"${DB_USER:-admin}\" -d \"${DB_NAME:-mydtbmav}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # ==========================================
  # 2. REDIS SERVICE (Session + Cache)
  # ==========================================
  redis:
    container_name: admin_orderlist-redis
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  # ==========================================
  # 3. BACKEND SERVICE (Node.js 20 - V2 Clean Architecture)
  # Hợp nhất: API REST, Webhook SePay, Internal Cron Scheduler & Event Bus
  # ==========================================
  backend:
    container_name: admin_orderlist-backend
    build:
      context: ./backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env.docker
    environment:
      APP_ENV: docker
      NODE_ENV: production
    ports:
      - "127.0.0.1:3001:3001"   # Main API
      - "127.0.0.1:5000:3001"   # Webhook port (forward trực tiếp vào backend để tương thích Nginx host)
    volumes:
      - ./warehouse_profiles:/root/.admin_orderlist/warehouse_browser_profiles
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.5'

  # ==========================================
  # 4. FRONTEND SERVICE (React + Vite + Nginx)
  # ==========================================
  frontend:
    container_name: admin_orderlist-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://admin.mavrykpremium.com}
    restart: always
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:8081:80"   # Frontend qua Host Nginx
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  # ==========================================
  # 5. CLOUD BROWSER (KasmVNC Web-Streamed Chromium)
  # Phục vụ đăng nhập tài khoản kho trực tiếp trên Web & lưu Profile vĩnh viễn
  # ==========================================
  cloud-browser:
    container_name: admin_orderlist-cloud-browser
    image: lscr.io/linuxserver/chromium:latest
    restart: always
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
      - CUSTOM_USER=admin
      - PASSWORD=mavryk_store_cloud_2026
      - CHROME_CLI=--no-sandbox --disable-dev-shm-usage https://account.adobe.com
    volumes:
      - ./warehouse_profiles:/config
    ports:
      - "127.0.0.1:3088:3000"
    shm_size: "1gb"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

# ==========================================
# NETWORKS & VOLUMES
# ==========================================
networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
