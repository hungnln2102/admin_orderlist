services:
  # ==========================================
  # 1. DATABASE SERVICE (PostgreSQL 16)
  # ==========================================
  postgres:
    container_name: admin_orderlist-postgres
    build:
      context: ./database
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in the deployment environment}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS must be set in the deployment environment}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in the deployment environment}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"${DB_USER:-admin}\" -d \"${DB_NAME:-mydtbmav}\"" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # ==========================================
  # 2. REDIS SERVICE (Session + Cache)
  # ==========================================
  redis:
    container_name: admin_orderlist-redis
    image: redis:7-alpine
    restart: always
    command: [ "redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru" ]
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  # ==========================================
  # 3. BACKEND SERVICE (Node.js 20 - V2 Clean Architecture)
  # Hợp nhất: API REST, Webhook SePay, Internal Cron Scheduler & Event Bus
  # ==========================================
  backend:
    container_name: admin_orderlist-backend
    build:
      context: ./backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env.docker
    environment:
      APP_ENV: docker
      TRUST_PROXY: "1"
      NODE_ENV: production
      WAREHOUSE_PROFILE_WORK_DIR: /var/lib/warehouse-browser
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:3001:3001" # Main API
      - "127.0.0.1:5000:3001" # Webhook port (forward trực tiếp vào backend để tương thích Nginx host)
    volumes:
      - ./warehouse_profiles:/root/.admin_orderlist/warehouse_browser_profiles
      - warehouse_browser_work:/var/lib/warehouse-browser
    stop_grace_period: 5m
    shm_size: "512mb"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.5'

  # ==========================================
  # 4. FRONTEND SERVICE (React + Vite + Nginx)
  # ==========================================
  frontend:
    container_name: admin_orderlist-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://admin.mavrykpremium.com}
    restart: always
    depends_on:
      backend:
        condition: service_started
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:8081:80" # Frontend qua Host Nginx
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

# ==========================================
# NETWORKS & VOLUMES
# ==========================================
networks:
  app-network:
    driver: bridge

volumes:
  warehouse_browser_work:
  postgres_data:
  redis_data:
